name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same branch/PR to keep the queue short.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Postgres with pgvector so integration tests (@pytest.mark.integration) actually run against
    # a real database, matching docker-compose.yml's `db` service. Redis too, for the tests that
    # need it. Both are exposed on their default ports and health-checked before the job proceeds.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
          POSTGRES_DB: meridian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meridian -d meridian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://meridian:meridian@localhost:5432/meridian
      REDIS_URL: redis://localhost:6379/0
      # No real key: LLM tests use ScriptedLLMProvider / OfflineLLMProvider, never the network.
      LLM_PROVIDER: offline
      DATA_MODE: snapshot
      SEC_USER_AGENT: "Meridian CI ci@example.com"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend package (dev,embeddings,otel)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,embeddings,otel]"

      - name: ruff check
        working-directory: backend
        run: ruff check src tests

      - name: ruff format --check
        working-directory: backend
        run: ruff format --check src tests

      - name: Apply database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: pytest
        working-directory: backend
        run: pytest -q --cov=meridian --cov-report=term-missing

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: eslint
        working-directory: frontend
        run: npm run lint

      - name: tsc --noEmit
        working-directory: frontend
        run: npm run typecheck

      - name: vitest
        working-directory: frontend
        run: npm run test

      - name: next build
        working-directory: frontend
        run: npm run build
