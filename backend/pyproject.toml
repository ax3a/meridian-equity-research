[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "meridian"
version = "0.1.0"
description = "Meridian - multi-agent equity research platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy[asyncio]>=2.0.35",
  "asyncpg>=0.30",
  "alembic>=1.13",
  "pgvector>=0.3.5",
  "psycopg[binary]>=3.2",
  "redis>=5.1",
  "httpx>=0.27",
  "tenacity>=9.0",
  "structlog>=24.4",
  "langgraph>=0.6",
  "langgraph-checkpoint-postgres>=2.0",
  "anthropic>=0.40",
  "beautifulsoup4>=4.12",
  "lxml>=5.3",
  "numpy>=1.26",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
embeddings = ["fastembed>=0.4"]
otel = [
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.7",
  "mypy>=1.13",
]

[project.scripts]
meridian = "meridian.cli:main"
meridian-worker = "meridian.worker.service:main"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: needs Postgres/Redis (docker compose up db redis)",
  "live: hits real external APIs",
]
addopts = "-ra -m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101", "RUF012", "B008", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"src/meridian/db/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
# Three `# type: ignore[no-any-return]` comments existed for errors this setting was never enabled to
# produce, so they sat inert and `warn_unused_ignores` flagged them. Turning it on makes them mean
# something again, and it cost one further genuine finding, not a backlog.
warn_return_any = true
