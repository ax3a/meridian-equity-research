[alembic]
script_location = src/meridian/db/migrations
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url is intentionally left unset here; env.py builds it from
# meridian.core.config.get_settings() (DATABASE_URL / .env), converted to a
# synchronous psycopg driver URL so migrations run without an event loop.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
