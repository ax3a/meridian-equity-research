services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: meridian
    ports:
      - "5432:5432"
    volumes:
      - meridian-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Application services -----------------------------------------------------------------
  # `db` and `redis` above have no profile, so `docker compose up` with no service names (or
  # `make docker-up-deps` / `scripts/docker-up.ps1 -DepsOnly`) starts only the datastores — the
  # normal local-dev setup, where you run the backend/frontend natively against them.
  #
  # `backend` and `frontend` are in the `full` profile: bring up the whole containerized stack
  # with:
  #   docker compose --profile full up -d --build
  # (or `make docker-up` / `scripts/docker-up.ps1`, which do exactly that).
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    profiles: ["full"]
    env_file:
      - .env
    environment:
      # Inside the compose network, services reach Postgres/Redis by service name, not
      # localhost — these override whatever localhost-oriented values are in .env.
      DATABASE_URL: postgresql+asyncpg://meridian:meridian@db:5432/meridian
      REDIS_URL: redis://redis:6379/0
      # Hand execution to the worker service. Set "inprocess" to run everything in the API instead.
      RUN_EXECUTOR: worker
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  # Executes research runs pulled from the Redis queue, so nothing CPU-heavy shares the API's event
  # loop. Shares the backend image and entrypoint; RUN_MIGRATIONS=0 because the API owns the schema and
  # two containers running alembic at once race on the version table. Scale with
  # `docker compose up -d --scale worker=3`.
  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    profiles: ["full"]
    command: ["python", "-m", "meridian.worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://meridian:meridian@db:5432/meridian
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "0"
      WORKER_CONCURRENCY: "2"
      WORKER_HEARTBEAT_PATH: /tmp/meridian-worker-alive
    # The worker serves no HTTP, so it must not inherit the API image's curl healthcheck -- it would
    # report unhealthy while working perfectly, and anything gated on `service_healthy` would stall.
    # The worker touches a heartbeat file while it is consuming; stale means wedged.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os,sys,time;
          p=os.environ['WORKER_HEARTBEAT_PATH'];
          sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 60 else 1)"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    profiles: ["full"]
    environment:
      MERIDIAN_API_BASE_URL: http://backend:8000
      # Must match the backend's own API_KEY (read from the root .env for compose variable
      # substitution); leave API_KEY unset/blank in .env to run with no API-key auth.
      MERIDIAN_API_KEY: ${API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5

volumes:
  meridian-db-data:
